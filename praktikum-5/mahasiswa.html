<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Nilai Mahasiswa</title>
    <style>
        body{
            
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        
        }
        input{
            width: 120px;
            height: 25px;
        }
        button{
            height: 30px;
            border-radius: 12px;
            border: black 1px solid;
            padding: 0 10px;
            color: rgb(0, 0, 0);
            background: rgb(255, 255, 255);
        }
        button:hover{
            color: white;
            background: black;
        }
    </style>
</head>
<body>

    <h2>Konversi Nilai Mahasiswa</h2>

    <input type="number" id="nilai" min="0" max="100" placeholder="Masukkan nilai">

    <button onclick="cekNilai()">Cek Grade</button>

    <p id="hasil"></p>

    <script>
        function cekNilai() {
            let nilai = document.getElementById("nilai").value;
            let grade;

            if (nilai >= 90 && nilai <= 100) {
                grade = "A";
            } else if (nilai >= 80) {
                grade = "B";
            } else if (nilai >= 70) {
                grade = "C";
            } else if (nilai >= 60) {
                grade = "D";
            } else if (nilai == "") {
                grade = "masukkan nilai";
            } else {
                grade = "E";
            }

            document.getElementById("hasil").innerHTML = "Grade : " + grade;
        }
    </script>

</body>
</html>
